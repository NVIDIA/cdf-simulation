# SQA prompt P05 -- catalog row 4, "Using the attached USD, generate tombstone
# structural defects with full board coverage", ICT_C0805_C22_coupon.usdc
# attached. "Full board coverage" is ratio 1.0; the angle band is the skill's
# fixed default, since the API has no default and the prompt states none. The
# scope is the narrowed component selection, not a tombstone-level
# component_types list: on an embedded-metadata board that list resolves to
# prim paths the stage does not carry and the operation applies nothing
# (verified 2026-09-11, see the skill's verification record). Like every
# row 4/5 record it carries operation labels and a per-component crop.
api_version: 1.0.0
domain: pcb-aoi
random_seed: 0

output_dir: ../../../sdg_test_output/skill_prompts/row4-tombstone

scene:
  usd: ../resources/ICT_C0805_C22_coupon.usdc
  root: /Board
  components:
    types: [C_0805_2012Metric]

appearance:
  lighting:
    mode: white_light
    exposure: 0.0
    cone_angle: 120.0
    cone_softness: 1.0
    dome:
      intensity: 1000.0
      visible: true

operations:
  tombstone:
    ratio: 1.0
    angle: [70.0, 90.0]

annotations:
  components: true
  # Rows 4 and 5 are reported as per-component defect crops: the defect
  # class goes into the segmentation output and a bbox_tight crop follows.
  operation_labels: defect

capture:
  renderer:
    mode: pathtracing
    resolution: [640, 360]
    spp: 1
    total_spp: 4
    max_bounces: 4
  camera:
    side: top
    rotation: {z: 0.0}
  scan_grid: [1, 1]
  outputs:
    annotators: [rgb, bounding_box_2d_tight, semantic_segmentation]
    colorize: [semantic_segmentation]

postprocess:
  # class_filter is left unset on purpose: a component-type string there is
  # the documented silent-zero-files failure.
  crop:
    method: bbox_tight
    types: [rgb, semantic_segmentation, component_instance]
    offset: 10
    xform_depth: 7
    output_subdir: cropped
