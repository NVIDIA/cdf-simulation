# Prompt fixture -- catalog row 5, "Using the attached USD, generate excess
# solder on the passives with full board coverage", ICT_C0805_C22_coupon.usdc
# attached. Solder defects ride on a simulated solve: solder_joints is declared
# once with surface_evolver (procedural plus a solder defect is rejected by
# design), then the one requested defect type. Needs manifold3d and the
# evolver binary in the executing environment; the shipped container has both.
api_version: 1.0.0
domain: pcb-aoi
random_seed: 0

output_dir: ../../../sdg_test_output/skill_prompts/row5-excess-solder

scene:
  usd: ../resources/ICT_C0805_C22_coupon.usdc
  root: /Board
  components:
    types: [C_0805_2012Metric]

appearance:
  lighting:
    mode: white_light
    exposure: 0.0
    cone_angle: 120.0
    cone_softness: 1.0
    dome:
      intensity: 1000.0
      visible: true

operations:
  solder_joints:
    solver: surface_evolver
    component_types: [C_0805_2012Metric]
  excess:
    ratio: 1.0
    component_types: [C_0805_2012Metric]

annotations:
  components: true
  # Rows 4 and 5 are reported as per-component defect crops: the defect
  # class goes into the segmentation output and a bbox_tight crop follows.
  operation_labels: defect

capture:
  renderer:
    mode: pathtracing
    resolution: [640, 360]
    spp: 1
    total_spp: 4
    max_bounces: 4
  camera:
    side: top
    rotation: {z: 0.0}
  scan_grid: [1, 1]
  outputs:
    annotators: [rgb, bounding_box_2d_tight, semantic_segmentation]
    colorize: [semantic_segmentation]

postprocess:
  # class_filter is left unset on purpose: a component-type string there is
  # the documented silent-zero-files failure.
  crop:
    method: bbox_tight
    types: [rgb, semantic_segmentation, component_instance]
    offset: 10
    xform_depth: 7
    output_subdir: cropped
