# SQA case N07 -- catalog row 4, P05's prompt WITHOUT "with full board
# coverage": "Using the attached USD, generate tombstone structural defects",
# ICT_C0805_C22_coupon.usdc attached. No coverage phrase means the skill's
# fixed default ratio of 0.2. The coupon is a one-component pool, and the
# executing side selects max(1, int(1 * 0.2)) = 1 -- a defect request on a
# non-empty selection never resolves to zero modified components, so this
# renders one tombstone exactly as row4_tombstone.yaml does; a clean coupon
# here fails the case. Scope, angle band, labels and crop are P05's.
api_version: 1.0.0
domain: pcb-aoi
random_seed: 0

output_dir: ../../../sdg_test_output/skill_prompts/row4-tombstone-default-coverage

scene:
  usd: ../resources/ICT_C0805_C22_coupon.usdc
  root: /Board
  components:
    types: [C_0805_2012Metric]

appearance:
  lighting:
    mode: white_light
    exposure: 0.0
    cone_angle: 120.0
    cone_softness: 1.0
    dome:
      intensity: 1000.0
      visible: true

operations:
  tombstone:
    ratio: 0.2
    angle: [70.0, 90.0]

annotations:
  components: true
  # Rows 4 and 5 are reported as per-component defect crops: the defect
  # class goes into the segmentation output and a bbox_tight crop follows.
  operation_labels: defect

capture:
  renderer:
    mode: pathtracing
    resolution: [640, 360]
    spp: 1
    total_spp: 4
    max_bounces: 4
  camera:
    side: top
    rotation: {z: 0.0}
  scan_grid: [1, 1]
  outputs:
    annotators: [rgb, bounding_box_2d_tight, semantic_segmentation]
    colorize: [semantic_segmentation]

postprocess:
  # class_filter is left unset on purpose: a component-type string there is
  # the documented silent-zero-files failure.
  crop:
    method: bbox_tight
    types: [rgb, semantic_segmentation, component_instance]
    offset: 10
    xform_depth: 7
    output_subdir: cropped
