# Download one PCB USD input object from S3, render a bottom-side golden
# image, and upload the completed output tree to a separate S3 prefix.
api_version: 1.0.0
domain: pcb-aoi

output_dir: s3://pcb-results/runs/job-123/s3-usd-input/output_dir

scene:
  usd: s3://pcb-inputs/uploads/job-123/board-a.usdc
  root: /Board

appearance:
  lighting:
    mode: white_light
    dome:
      intensity: 1000.0
      visible: true

capture:
  renderer:
    resolution: [640, 360]
    total_spp: 4
  camera:
    side: bottom
    rotation: {x: 0.0, y: 0.0, z: -90.0}
  scan_grid: [1, 1]
  limits: {triggers: 1, max_images: 1}
  outputs:
    annotators: [rgb]
