# Minimal PCB-AOI JobConfig that captures one top-side RGB image using the
# default renderer and capture behavior wherever possible.
api_version: 1.0.0
domain: pcb-aoi

output_dir: ../../../sdg_test_output/examples/minimal/output_dir

scene:
  usd: /path/to/your_board.usdc  # EDIT ME -- this release ships no board; see README.md
  root: /Board

capture:
  renderer:
    resolution: [320, 180]
    total_spp: 4
  camera:
    side: top
    rotation: {x: 0.0, y: 0.0, z: -90.0}
  scan_grid: [1, 1]
  limits: {triggers: 1, max_images: 1}
  outputs:
    annotators: [rgb]
